name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:all
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assets = @()
          if (Test-Path dist/zip) { $assets += Get-ChildItem dist/zip -File }
          if (Test-Path dist/apk) { $assets += Get-ChildItem dist/apk -File }
          if ($assets.Count -eq 0) { throw "No release assets found in dist/zip or dist/apk." }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title $env:RELEASE_TAG --notes "DoL-Thalia $env:RELEASE_TAG"
          }
          gh release upload $env:RELEASE_TAG @($assets.FullName) --clobber

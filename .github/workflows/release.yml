name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Cordova
        run: npm install -g cordova@13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:all
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $releaseTag = $env:INPUT_TAG

          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $releaseTag = $env:GITHUB_REF_NAME
            } else {
              $releaseTag = "build-$env:GITHUB_RUN_NUMBER"
            }
          }

          $assets = @()
          if (Test-Path dist/zip) { $assets += Get-ChildItem dist/zip -File | Where-Object { $_.Extension -ne '.idsig' } }
          if (Test-Path dist/apk) { $assets += Get-ChildItem dist/apk -File | Where-Object { $_.Extension -ne '.idsig' } }
          if ($assets.Count -eq 0) { throw "No release assets found in dist/zip or dist/apk." }

          git fetch --tags

          git rev-parse -q --verify "refs/tags/$releaseTag" *> $null
          if ($LASTEXITCODE -ne 0) {
            git tag $releaseTag $env:GITHUB_SHA
            git push origin $releaseTag
          }

          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --title $releaseTag --notes "DoL-Thalia $releaseTag"
          }
          gh release upload $releaseTag @($assets.FullName) --clobber

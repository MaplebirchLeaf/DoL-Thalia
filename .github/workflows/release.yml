name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.5.12.13
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thalia-release-and-pages
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Validate release tag and source commit
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          release_tag="$INPUT_TAG"
          if [ -z "$release_tag" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          git check-ref-format "refs/tags/$release_tag" || { echo "Invalid release tag: $release_tag" >&2; exit 1; }

          presets="thalia,goose-f-mysterious,goose-m-mysterious,goose-f,goose-m,mysterious"
          if [[ "$release_tag" =~ ^v([0-9]+(\.[0-9]+){3})(-([0-9]{4}))?$ ]]; then
            game="standard"
            game_version="${BASH_REMATCH[1]}"
            release_date="${BASH_REMATCH[4]}"
            presets="$presets,chs,chs-goose-f-mysterious,chs-goose-m-mysterious,chs-goose-f,chs-goose-m,chs-mysterious"
          elif [[ "$release_tag" =~ ^vdolp-([0-9]+(\.[0-9]+){1,3})(-([0-9]{4}))?$ ]]; then
            game="dolp"
            game_version="${BASH_REMATCH[1]}"
            release_date="${BASH_REMATCH[4]}"
          else
            echo "Expected v<four-part-version>[-MMDD] or vdolp-<version>[-MMDD], found: $release_tag" >&2
            exit 1
          fi

          source_commit="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            tag_commit="$(git rev-parse "refs/tags/$release_tag^{commit}")"
            test "$tag_commit" = "$source_commit" || { echo "Release tag $release_tag points to $tag_commit, but checkout is $source_commit." >&2; exit 1; }
          fi

          printf '%s\n' "THALIA_RELEASE_TAG=$release_tag" "THALIA_GAME=$game" "THALIA_GAME_VERSION=$game_version" "THALIA_RELEASE_DATE=$release_date" "THALIA_PRESETS=$presets" >> "$GITHUB_ENV"
          echo "Release: $release_tag ($game $game_version at $source_commit)"

      - name: Check private resource access
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_MODS_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing PRIVATE_MODS_TOKEN secret." >&2; exit 1; }
          gh release view assets --repo MaplebirchLeaf/DoL-Thalia-Assets >/dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check build tools and native downloader
        run: |
          bun run check
          bun test ./tests
          bun run test:audit
          bun run test:native

      - name: Restore APK signing keystore
        shell: bash
        env:
          THALIA_KEYSTORE_BASE64: ${{ secrets.THALIA_KEYSTORE_BASE64 }}
        run: |
          test -n "$THALIA_KEYSTORE_BASE64" || { echo "Missing THALIA_KEYSTORE_BASE64 secret." >&2; exit 1; }
          mkdir -p input/signing
          printf '%s' "$THALIA_KEYSTORE_BASE64" | base64 --decode > input/signing/DoL-Thalia.keystore

      - name: Build release assets
        run: |
          if [ "$THALIA_GAME" = "dolp" ]; then
            bun run build:all --game="$THALIA_GAME" --version="$THALIA_GAME_VERSION" --presets="$THALIA_PRESETS" --targets=zip,apk
          else
            bun run build:ready --game="$THALIA_GAME" --version="$THALIA_GAME_VERSION" --presets="$THALIA_PRESETS" --targets=zip,apk
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_MODS_TOKEN || github.token }}
          THALIA_MOD_PROXY_URL: ${{ vars.THALIA_MOD_PROXY_URL }}

      - name: Verify runtime regressions
        run: bun run test:runtime

      - name: Audit release artifacts
        run: bun run audit

      - name: Verify expected release assets
        run: bun run src/commands/verify-release.ts --game="$THALIA_GAME" --version="$THALIA_GAME_VERSION" --presets="$THALIA_PRESETS"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist/zip dist/apk -maxdepth 1 -type f \( -name '*.zip' -o -name '*.apk' \) -print | sort)
          test ${#assets[@]} -gt 0 || { echo "No release assets found in dist/zip or dist/apk." >&2; exit 1; }

          git fetch --tags
          if git rev-parse -q --verify "refs/tags/$THALIA_RELEASE_TAG" >/dev/null; then
            test "$(git rev-parse "refs/tags/$THALIA_RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || { echo "Release tag changed after validation." >&2; exit 1; }
          else
            git tag "$THALIA_RELEASE_TAG" HEAD
            git push origin "$THALIA_RELEASE_TAG"
          fi
          gh release view "$THALIA_RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$THALIA_RELEASE_TAG" --verify-tag --title "$THALIA_RELEASE_TAG" --draft --generate-notes
          gh release upload "$THALIA_RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$THALIA_RELEASE_TAG" --draft=false

      - name: Build site
        run: bun run site:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.5.8.10-0524
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve release tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $releaseTag = $env:INPUT_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag)) { if ($env:GITHUB_REF_TYPE -eq 'tag') { $releaseTag = $env:GITHUB_REF_NAME } }
          if ([string]::IsNullOrWhiteSpace($releaseTag)) { throw "Missing release tag." }

          $releaseName = $releaseTag -replace '^v', ''
          $game = if ($releaseName.StartsWith('dolp-')) { 'dolp' } else { 'standard' }
          $gameVersion = ($releaseName -replace '^dolp-', '') -replace '-\d{4}$', ''
          $releaseDate = if ($releaseName -match '-(\d{4})$') { $Matches[1] } else { '' }

          "THALIA_RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "THALIA_GAME=$game" >> $env:GITHUB_ENV
          "THALIA_GAME_VERSION=$gameVersion" >> $env:GITHUB_ENV
          "THALIA_RELEASE_DATE=$releaseDate" >> $env:GITHUB_ENV

          Write-Host "Release: $releaseTag ($game $gameVersion)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore APK signing keystore
        shell: bash
        env:
          THALIA_KEYSTORE_BASE64: ${{ secrets.THALIA_KEYSTORE_BASE64 }}
        run: |
          test -n "$THALIA_KEYSTORE_BASE64" || { echo "Missing THALIA_KEYSTORE_BASE64 secret." >&2; exit 1; }
          mkdir -p input/signing
          printf '%s' "$THALIA_KEYSTORE_BASE64" | base64 --decode > input/signing/DoL-Thalia.keystore

      - name: Build release assets
        run: bun run build:all --game="$THALIA_GAME" --version="$THALIA_GAME_VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_MODS_TOKEN || github.token }}

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist/zip dist/apk -maxdepth 1 -type f ! -name '*.idsig' 2>/dev/null)
          test ${#assets[@]} -gt 0 || { echo "No release assets found in dist/zip or dist/apk." >&2; exit 1; }

          git fetch --tags
          git rev-parse -q --verify "refs/tags/$THALIA_RELEASE_TAG" >/dev/null || {
            git tag "$THALIA_RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$THALIA_RELEASE_TAG"
          }
          gh release view "$THALIA_RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$THALIA_RELEASE_TAG" --title "$THALIA_RELEASE_TAG" --notes "DoL-Thalia $THALIA_RELEASE_TAG"
          gh release upload "$THALIA_RELEASE_TAG" "${assets[@]}" --clobber

      - name: Build site
        run: bun run site:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

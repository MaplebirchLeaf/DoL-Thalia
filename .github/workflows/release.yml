name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.5.8.10-0524
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve release tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $releaseTag = $env:INPUT_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag)) { if ($env:GITHUB_REF_TYPE -eq 'tag') { $releaseTag = $env:GITHUB_REF_NAME } }

          "THALIA_RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV

          Write-Host "Release tag: $releaseTag"

      - name: Create empty release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = $env:THALIA_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($releaseTag)) { throw "Missing THALIA_RELEASE_TAG." }

          git fetch --tags

          git rev-parse -q --verify "refs/tags/$releaseTag" *> $null
          if ($LASTEXITCODE -ne 0) {
            git tag $releaseTag $env:GITHUB_SHA
            git push origin $releaseTag
          }

          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --title $releaseTag --notes "DoL-Thalia $releaseTag"
          } else {
            Write-Host "Release already exists: $releaseTag"
          }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run site:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.5.12.13
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thalia-release-and-pages
  cancel-in-progress: false

jobs:
  release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag and source commit
        run: bun run src/commands/release-plan.ts
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Ensure release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$THALIA_RELEASE_TAG" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$THALIA_RELEASE_TAG" -f sha="$(git rev-parse HEAD)" >/dev/null
            git fetch --tags --force
          fi
          test "$(git rev-parse "refs/tags/$THALIA_RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || { echo "Release tag does not match the source commit." >&2; exit 1; }

      - name: Check private resource access
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_MODS_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing PRIVATE_MODS_TOKEN secret." >&2; exit 1; }
          gh release view assets --repo MaplebirchLeaf/DoL-Thalia-Assets >/dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore and validate APK signing keystore
        env:
          THALIA_KEYSTORE_BASE64: ${{ secrets.THALIA_KEYSTORE_BASE64 }}
        run: bun run src/commands/restore-signing-keystore.ts

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check types, lint and formatting
        run: bun run check

      - name: Build release assets
        run: bun run build:ready --game="$THALIA_GAME" --version="$THALIA_GAME_VERSION" --presets="$THALIA_PRESETS" --targets=zip,apk
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_MODS_TOKEN || github.token }}
          THALIA_MOD_PROXY_URL: ${{ vars.THALIA_MOD_PROXY_URL }}

      - name: Audit release artifacts
        run: bun run audit

      - name: Verify expected release assets
        run: bun run src/commands/verify-release.ts --game="$THALIA_GAME" --version="$THALIA_GAME_VERSION" --presets="$THALIA_PRESETS"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist/zip dist/apk -maxdepth 1 -type f \( -name '*.zip' -o -name '*.apk' \) -print | sort)
          test ${#assets[@]} -gt 0 || { echo "No release assets found in dist/zip or dist/apk." >&2; exit 1; }

          # Checkout may peel annotated tags into a local commit ref.
          git fetch --tags --force
          test "$(git rev-parse "refs/tags/$THALIA_RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || { echo "Release tag changed after validation." >&2; exit 1; }
          gh release view "$THALIA_RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$THALIA_RELEASE_TAG" --verify-tag --title "$THALIA_RELEASE_TAG" --draft --generate-notes
          gh release upload "$THALIA_RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$THALIA_RELEASE_TAG" --draft=false

      - name: Build online play
        run: bun run site:play

      - name: Build site
        run: bun run site:build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify online play contains only bundled mods
        run: |
          python3 tools/audit_release.py --html dist/site/play/en/index.html --online-play
          python3 tools/audit_release.py --html dist/site/play/chs/index.html --online-play

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

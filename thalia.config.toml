[project]
name = "DoL-Thalia"

[game]
default_mod_list = "goose-f-mysterious"
version = "0.5.12.13"

[games.dolp]
version = "0.778"
source_html = "input/game-dolp/*.zip"
default_mod_list = "goose-f-mysterious"
mods_dir = "input/mods-dolp"
mod_list = "input/modList-dolp.json"
release_repository = "Frostberg/degrees-of-lewdity-plus"

[mod_sources.chinese-localization]
repository = "Eltirosto/Degrees-of-Lewdity-Chinese-Localization"
release_tag = "v0.5.12.13-chs-1.0.1a"
dolp_repository = ""
asset_keywords = ["ModI18N"]
asset_extensions = [".mod.zip"]

[mod_sources.maplebirch-framework]
repository = "MaplebirchLeaf/SCML-DOL-maplebirchFramework"
release_tag = "maplebirch-release-v5.4.2"
asset_keywords = ["maplebirch"]
asset_extensions = [".mod.zip", ".modpack"]

[mod_sources.deadwood-reblooms]
repository = "MaplebirchLeaf/Deadwood-Reblooms"
release_tag = "v1.4.2"
asset_keywords = ["deadwood-reblooms", "deadwood-reblooms-audio"]
asset_extensions = [".modpack"]

[mod_sources.revelation-the-book-of-return]
repository = "MaplebirchLeaf/Revelation-The-Book-of-Return"
release_tag = "v1.1.1"
asset_keywords = ["revelation-the-book-of-return"]
asset_extensions = [".modpack"]

[mod_sources."Fem Goose Compilation"]
repository = "MaplebirchLeaf/DoL-Thalia-Assets"
release_tag = "assets"
asset_keywords = ["Fem.Goose.Compilation"]
asset_extensions = [".zip"]

[mod_sources."Masc Goose Compilation"]
repository = "MaplebirchLeaf/DoL-Thalia-Assets"
release_tag = "assets"
asset_keywords = ["Masc.Goose.Compilation"]
asset_extensions = [".zip"]

[mod_sources."Mysterious"]
repository = "MaplebirchLeaf/DoL-Thalia-Assets"
release_tag = "assets"
asset_keywords = ["Mysterious"]
asset_extensions = [".zip"]

[mod_sources."NPC Sidebar Portraits"]
repository = "MaplebirchLeaf/DoL-Thalia-Assets"
release_tag = "assets"
asset_keywords = ["NPC.Sidebar.Portraits"]
asset_extensions = [".zip"]

[upstreams.sugarcube_vrelnir]
url = "https://gitgud.io/Vrelnir/sugarcube-2"
ref = "378d9b950a4bf9ddbeb9fe21692acdd7659b6dc3"
path = "vendor/sugarcube-2-vrelnir"

[upstreams.modloader]
url = "https://github.com/MaplebirchLeaf/sugarcube-2-ModLoader"
ref = "thalia"
path = "vendor/sugarcube-2-ModLoader"

[paths]
source_html = "input/game/*.zip"
builtin_mods = "input/mods"
output_html = "dist/html/index.html"
output_zip = "dist/zip/DoL-Thalia.zip"
output_apk_dir = "dist/apk"
story_format = "dist/story-format/sugarcube-2/format.js"
cordova_project = ".cache/apk/dol-thalia-android"

[apk]
id = "com.maplebirch.dol.thalia"
name = "DoL Thalia"

[apk.toolchain]
cordova_android = "14.0.1"
java = 17
sdk = 35
build_tools = "35.0.0"
command_line_tools = "15859902"
gradle = "8.13"

# Private ParaTranz export; only existing source-anchored ModI18N rules are refreshed.
[localization_data]
repository = "MaplebirchLeaf/DoL-Thalia-Assets"
release_tag = "assets"
asset_name = "2026_10_06_12_14_58_5b8c66.zip"
sha256 = "8269611d2a5bc3d6a5ca430202f81c8162ea41027f2e138340e5a7c7489ee607"
game_version = "0.5.12.13"
